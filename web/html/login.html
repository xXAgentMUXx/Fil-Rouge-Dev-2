<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/web/css/login.css">
    <title>Connexion — Y-Plaza</title>
</head>
<body>

<div class="container">
    <div class="card-inner">
        <div class="card-brand">
            <a href="/" class="brand-name">Y<span>·</span>Plaza</a>
        </div>
        <div class="card-header">
            <span class="card-eyebrow">Bon retour</span>
            <h1>Connexion</h1>
        </div>
        <form action="/post-login" method="POST" class="form">

            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email"
                       placeholder="exemple@mail.com" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Se connecter</button>
        </form>
        <div class="separator"><span>OU</span></div>
        <div class="oauth">
            <a href="/auth/google" class="oauth-btn google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                Continuer avec Google
            </a>
            <a href="/auth/github" class="oauth-btn github">
                <img src="https://www.svgrepo.com/show/512317/github-142.svg" alt="GitHub">
                Continuer avec GitHub
            </a>
        </div>
        <p class="redirect">
            Pas encore de compte ? <a href="/register">Créer un compte</a>
        </p>
    </div>
</div>
</body>
</html>
