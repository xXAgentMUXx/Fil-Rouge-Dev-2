<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../web/css/index.css">

<title>Détail propriété</title>

</head>

<body>

<a href="/properties">⬅ Retour aux propriétés</a>
<a href="/favorites">⭐ Mes favoris</a>
<a href="/profile">Mon Profil</a>
<a href="/logout">Déconnexion</a>

<h1>{{.Title}}</h1>

<div class="property-detail">

<img src="{{if .Image}}{{.Image}}{{else}}/images/default-house.jpg{{end}}" 
alt="Image propriété" 
style="width:300px;height:auto;">

<p><strong>Ville :</strong> {{.City}}</p>

<p><strong>Prix :</strong> {{.Price}} €</p>

<p><strong>Surface :</strong> {{.Surface}} m²</p>

<p><strong>Description :</strong></p>

<p>{{.Description}}</p>

<p><strong>Date de publication :</strong> {{.CreatedAt}}</p>

{{if .IsSold}}

<p class="sold">❌ Propriété déjà vendue</p>

{{else}}

<form action="/pay-property" method="POST">

<input type="hidden" name="property_id" value="{{.ID}}">

<button type="submit">
Acheter cette propriété
</button>

</form>

<form action="/favorite/add" method="POST">

<input type="hidden" name="property_id" value="{{.ID}}">

<button type="submit">
❤️ Ajouter aux favoris
</button>

</form>

{{end}}

</div>

</body>
</html>
