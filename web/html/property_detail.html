<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../web/css/property_detail.css">

<title>Détail propriété - Y-Plaza</title>

</head>

<body>

<div class="container">

<div class="top-bar">

<a href="/properties">⬅ Retour</a>
<a href="/favorites">⭐ Mes favoris</a>
<a href="/profile">👤 Profil</a>
<a href="/logout">🚪 Déconnexion</a>

</div>

<h1>{{.Title}}</h1>

<div class="property-detail">

<img src="{{if .Image}}{{.Image}}{{else}}/images/default-house.jpg{{end}}" 
alt="Image propriété">

<div class="property-info">

<p><strong>Ville :</strong> {{.City}}</p>

<p class="price">{{.Price}} €</p>

<p><strong>Surface :</strong> {{.Surface}} m²</p>

<p><strong>Description :</strong></p>

<p>{{.Description}}</p>

<p class="date"><strong>Date :</strong> {{.CreatedAt}}</p>

{{if .IsSold}}

<p class="sold">❌ Propriété déjà vendue</p>

{{else}}

<form action="/pay-property" method="POST">

<input type="hidden" name="property_id" value="{{.ID}}">

<button class="buy-btn">
Acheter cette propriété
</button>

</form>

<form action="/favorite/add" method="POST">

<input type="hidden" name="property_id" value="{{.ID}}">

<button class="fav-btn">
❤️ Ajouter aux favoris
</button>

</form>

{{end}}

</div>

</div>

</div>

</body>
</html>
