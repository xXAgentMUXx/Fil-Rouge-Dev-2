<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une propriété</title>
</head>
<body>

<h1>Ajouter une nouvelle propriété</h1>

<form action="/add-property" method="post" enctype="multipart/form-data">

    <label for="title">Titre :</label>
    <input type="text" name="title" required><br>

    <label for="description">Description :</label>
    <textarea name="description" required></textarea><br>

    <label for="city">Ville :</label>
    <input type="text" name="city" required><br>

    <label for="price">Prix :</label>
    <input type="text" name="price" required><br>

    <label for="surface">Surface :</label>
    <input type="text" name="surface" required><br>

    <label for="agency_id">Choisir une Agence :</label>
    <select name="agency_id" required>
        {{range .}}
            <option value="{{.ID}}">{{.Name}}</option>
        {{end}}
    </select><br>

    <label for="image">Image de la propriété :</label>
    <input type="file" name="image" accept="image/*"><br><br>

    <input type="submit" value="Ajouter">

</form>

</body>
</html>
