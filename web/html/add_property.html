<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../web/css/add_property.css">
<title>Ajouter une propriété - Y-Plaza</title>
</head>

<body>

<div class="form-container">

<h1>🏡 Ajouter une nouvelle propriété</h1>

<form action="/add-property" method="post" enctype="multipart/form-data" class="property-form">

<div class="form-grid">

<div class="form-group">
<label>Titre</label>
<input type="text" name="title" placeholder="Ex : Appartement centre ville" required>
</div>

<div class="form-group">
<label>Ville</label>
<input type="text" name="city" placeholder="Ex : Marseille" required>
</div>

<div class="form-group">
<label>Prix (€)</label>
<input type="number" name="price" placeholder="Ex : 350000" required>
</div>

<div class="form-group">
<label>Surface (m²)</label>
<input type="number" name="surface" placeholder="Ex : 85" required>
</div>

</div>

<div class="form-group">
<label>Description</label>
<textarea name="description" placeholder="Décrivez la propriété..." required></textarea>
</div>

<div class="form-group">
<label>Agence</label>
<select name="agency_id" required>
{{range .}}
<option value="{{.ID}}">{{.Name}}</option>
{{end}}
</select>
</div>

<div class="form-group image-upload">

<label>Image de la propriété</label>
<input type="file" name="image" accept="image/*">

</div>

<button class="primary-btn" type="submit">
Ajouter la propriété
</button>

</form>

</div>

</body>
</html>
