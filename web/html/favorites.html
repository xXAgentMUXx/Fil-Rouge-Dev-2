<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../web/css/favorite.css">
<title>Mes Favoris - Y-Plaza</title>
</head>

<body>
<div class="container">
<div class="top-bar">
<a href="/properties" class="back-btn">⬅ Retour</a>
<a href="/profile" class="back-btn">👤 Profil</a>
<a href="/logout" class="back-btn">🚪 Déconnexion</a>
</div>
<h1>⭐ Mes Favoris</h1>
<div class="favorites-list">
{{range .}}
<div class="property-card">
<h3>{{.Title}}</h3>
<p class="city">{{.City}}</p>
<p class="price">{{.Price}} €</p>
<form action="/favorite/remove" method="POST">
<input type="hidden" name="property_id" value="{{.ID}}">
<button type="submit">❌ Retirer</button>
</form>
</div>
{{end}}
</div>
</div>
</body>
</html>
