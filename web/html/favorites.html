<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../web/css/favorite.css">
<title>Ajouter une propriété - Y-Plaza</title>
</head>

<h1>Mes Favoris</h1>

{{range .}}

<div class="property-card">

<h3>{{.Title}}</h3>

<p>{{.City}}</p>

<p>{{.Price}} €</p>

<form action="/favorite/remove" method="POST">

<input type="hidden" name="property_id" value="{{.ID}}">

<button type="submit">❌ Retirer</button>

</form>

</div>

{{end}}
